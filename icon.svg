<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Accent Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Sun with Glow -->
  <circle cx="210" cy="205" r="88" fill="url(#sunGrad)" filter="url(#glow)"/>
  
  <!-- Sun Rays -->
  <g stroke="#fbbf24" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="210" y1="75" x2="210" y2="45"/>
    <line x1="90" y1="205" x2="60" y2="205"/>
    <line x1="125" y1="120" x2="100" y2="95"/>
    <line x1="295" y1="120" x2="320" y2="95"/>
  </g>

  <!-- Cloud -->
  <g filter="url(#shadow)">
    <path d="M370 380 H175 a75 75 0 0 1 -10 -149 105 105 0 0 1 200 -31 82 82 0 0 1 5 180 z" 
          fill="url(#cloudGrad)"/>
  </g>

  <!-- Dynamic Cyan Drop Accent -->
  <g transform="translate(0, 10)">
    <path d="M220 405 C220 405 205 425 205 435 A15 15 0 0 0 235 435 C235 425 220 405 220 405 Z" fill="#38bdf8"/>
    <path d="M280 405 C280 405 265 425 265 435 A15 15 0 0 0 295 435 C295 425 280 405 280 405 Z" fill="#38bdf8"/>
  </g>
</svg>
